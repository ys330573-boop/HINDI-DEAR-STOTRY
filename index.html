श और हाथी से भी आगे निकल गया।", "vo2_st03": "वह नाले के ऊपर से कूद गया।", "vo2_st04": "झाड़ियाँ पार कर गया।", "vo2_st05": "मैदान में एक पत्थर से ठोकर खाकर वह गिर गया।", "vo2_st06": "गिरने के कारण वह फूट-फूटकर रोने लगा।", "vo2_st07": "बंदर ने पैर सहलाया, पर वह चुप नहीं हुआ।", "vo2_st08": "भालू दादा ने गोद में उठाया, पर वह चुप नहीं हुआ।", "vo2_st09": "माँ आईं और बोलीं, “लो, पत्थर को मार दिया।”", "vo2_st10": "हिरण का बच्चा बोला, “इसे मत मारो। वरना यह भी रोने लगेगा।”", "vo2_st11": "माँ हँस दीं और बच्चा भी हँसने लगा।", "vo2_t7_ans": "इसका मतलब है — हिरण का बच्चा भागते हुए पत्थर से टकराया और गिर गया। तो ठोकर का मतलब हुआ, पैर किसी चीज़ से टकराना।", "vo2_t7_end": "इस तरह हम आगे-पीछे के वाक्यों से और चित्रों को देखकर शब्दों का मतलब जानने की कोशिश करते हैं।", "vo2_t7_q": "‘ठोकर’ का क्या मतलब है?", "vo2_t7_type": "कहानी में ठोकर का मतलब नहीं लिखा है। आइए, आगे-पीछे के वाक्यों से सुराग़ ढूँढकर इस शब्द का मतलब जानते हैं।", "vo2_t8_ans": "इसका मतलब है — बंदर ने हिरण को चुप कराने और पैर को हाथ फेरकर आराम देने की कोशिश की। पर वह चुप नहीं हुआ। तो सहलाने का अर्थ हुआ, प्यार से हाथ फेरना।", "vo2_t8_q": "‘सहलाया’ का क्या मतलब है? आइए, आगे-पीछे के वाक्य पढ़ें।", "vo2_t8_read": "हिरण का बच्चा रो रहा था। बंदर ने पैर सहलाया, पर बच्चा चुप नहीं हुआ।", "vo2_w_badal": "बादल", "vo2_w_bakri": "बकरी", "vo2_w_basta": "बस्ता", "vo2_w_chupchap": "चुपचाप", "vo2_w_gilahri": "गिलहरी", "vo2_w_hiran": "हिरण", "vo2_w_jhadi": "झाड़ियाँ", "vo2_w_jhadiyan": "झाड़ियाँ", "vo2_w_kisan": "किसान", "vo2_w_koodna": "कूदना", "vo2_w_nala": "नाला", "vo2_w_sahlana": "सहलाना", "vo2_w_shor": "शोर", "vo2_w_suraj": "सूरज", "vo2_w_thokar": "ठोकर", "vo2_ws1_q": "कहानी में आए शब्दों को पहचानकर, इस वर्ग पहेली में ढूँढ़िए और उन पर गोला लगाइए।", "vo2_ws2_q": "अब कुछ नए शब्दों का अर्थ समझकर, सही शब्द इस वर्ग पहेली में ढूँढ़िए और उन पर गोला लगाइए।", "vo_o_opt_tokri": "टोकरी", "vo_o_t_bhookh": "भूख लगना", "vo_o_t_kheencha": "ज़ोर से पैर खींचा", "vo_o_t_saheli": "सहेली बनाई", "vo_o_t_takrana": "पैर किसी चीज़ से टकराना", "vo_pt_guided"
